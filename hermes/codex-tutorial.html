  <style>
    * { font-family: 'Noto Sans SC', sans-serif; }
    
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a2e;
      --accent: #6c5ce7;
      --accent2: #a29bfe;
      --accent-glow: rgba(108, 92, 231, 0.3);
      --text-primary: #f0f0f5;
      --text-secondary: #a0a0b0;
      --border: rgba(255,255,255,0.08);
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated gradient background */
    .hero-bg {
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 25%, #0d0d1a 50%, #12121f 75%, #0a0a0f 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Grid pattern overlay */
    .grid-overlay {
      background-image: 
        linear-gradient(rgba(108, 92, 231, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108, 92, 231, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Glowing orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: float 8s ease-in-out infinite;
    }

    .orb-1 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(108, 92, 231, 0.6), transparent 70%);
      top: -100px; right: -100px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(162, 155, 254, 0.5), transparent 70%);
      bottom: 100px; left: -80px;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(108, 92, 231, 0.4), transparent 70%);
      top: 50%; left: 50%;
      animation-delay: -2s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    /* Section cards */
    .section-card {
      background: linear-gradient(135deg, rgba(26, 26, 46, 0.8), rgba(18, 18, 31, 0.9));
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .section-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      transform: scaleX(0);
      transition: transform 0.4s ease;
    }

    .section-card:hover {
      transform: translateY(-5px) scale(1.01);
      border-color: rgba(108, 92, 231, 0.4);
      box-shadow: 0 20px 60px rgba(108, 92, 231, 0.15), 0 0 40px rgba(108, 92, 231, 0.1);
    }

    .section-card:hover::before {
      transform: scaleX(1);
    }

    /* Subsection items */
    .sub-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.3s ease;
    }

    .sub-item:hover {
      background: rgba(108, 92, 231, 0.1);
      border-color: rgba(108, 92, 231, 0.3);
      transform: translateX(5px);
    }

    /* TOC sidebar */
    .toc-item {
      transition: all 0.3s ease;
      border-left: 2px solid transparent;
    }

    .toc-item:hover, .toc-item.active {
      border-left-color: var(--accent);
      background: rgba(108, 92, 231, 0.1);
      padding-left: 12px;
    }

    /* Scroll progress bar */
    #progressBar {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
      z-index: 9999;
      transition: width 0.1s ease;
      box-shadow: 0 0 10px var(--accent);
    }

    /* Badge styles */
    .badge-new {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.95); }
    }

    /* Number counters */
    .section-number {
      font-size: 4rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.3;
      position: absolute;
      top: -10px;
      right: 20px;
      line-height: 1;
    }

    /* Terminal-style code blocks */
    .code-block {
      background: #0d0d1a;
      border: 1px solid rgba(108, 92, 231, 0.2);
      border-radius: 8px;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 0.85rem;
      overflow: hidden;
    }

    .code-block::before {
      content: '● ● ●';
      display: block;
      padding: 8px 15px;
      background: rgba(108, 92, 231, 0.1);
      color: var(--accent2);
      font-size: 10px;
      letter-spacing: 3px;
    }

    .code-block code {
      display: block;
      padding: 15px 20px;
      color: #e0e0e0;
      line-height: 1.6;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

    /* Animate on scroll */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Navigation dot indicators */
    .nav-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-dot.active {
      background: var(--accent);
      box-shadow: 0 0 15px var(--accent);
      transform: scale(1.3);
    }

    /* Tag pills */
    .tag-pill {
      background: rgba(108, 92, 231, 0.15);
      border: 1px solid rgba(108, 92, 231, 0.3);
      color: var(--accent2);
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .tag-pill:hover {
      background: rgba(108, 92, 231, 0.3);
      transform: scale(1.05);
    }

    /* Divider lines */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 40px 0;
    }

    /* Search bar */
    .search-box {
      background: rgba(26, 26, 46, 0.8);
      border: 1px solid rgba(108, 92, 231, 0.2);
      transition: all 0.3s ease;
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(108, 92, 231, 0.2);
    }

    /* Mobile TOC */
    @media (max-width: 1024px) {
      .sidebar { display: none; }
      .sidebar.mobile-visible { 
        display: block; 
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 280px;
        z-index: 1000;
        background: var(--bg-secondary);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 20px;
      }
    }

    /* Toggle mobile menu button */
    #menuToggle {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1001;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      display: none;
    }

    @media (max-width: 1024px) {
      #menuToggle { display: block; }
    }
  </style>
</head>

  const tocNav = document.getElementById('toc');
  tocData.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'toc-item rounded-lg px-3 py-2 cursor-pointer';
    div.innerHTML = `
      <div class="flex items-center gap-2 text-sm">
        <span class="text-purple-400 font-bold text-xs">${item.num}</span>
        <span class="text-gray-300">${item.title}</span>
      </div>
      ${item.subs.length > 0 ? `<div class="ml-5 mt-1 space-y-1">${item.subs.map(s => `<div class="text-xs text-gray-500 hover:text-purple-400 cursor-pointer">· ${s}</div>`).join('')}</div>` : ''}
    `;
    div.onclick = () => document.getElementById(`section-${idx + 1}`).scrollIntoView({ behavior: 'smooth' });
    tocNav.appendChild(div);
  });

  // Build sections
  const main = document.querySelector('main');
  tocData.forEach((item, idx) => {
    const sec = sectionContent[idx + 1];
    const section = document.createElement('section');
    section.id = `section-${idx + 1}`;
    section.className = 'reveal mb-12';
    section.innerHTML = `
      <div class="section-card rounded-2xl p-8 relative overflow-hidden" style="border-color: ${sec.color}20">
        <div class="section-number">${item.num}</div>
        <div class="relative z-10">
          <div class="flex items-center gap-3 mb-6">
            <span class="text-3xl">${sec.icon}</span>
            <div>
              <span class="text-xs font-medium px-2 py-1 rounded-full" style="background: ${sec.color}20; color: ${sec.color}">${item.num}</span>
              <h2 class="text-2xl font-bold text-white mt-1">${item.title}</h2>
            </div>
          </div>
          <div class="text-base leading-relaxed text-gray-300">
            ${sec.content}
          </div>
        </div>
      </div>
    `;
    main.appendChild(section);
  });

  // Build nav dots
  const navDots = document.getElementById('navDots');
  tocData.forEach((item, idx) => {
    const dot = document.createElement('div');
    dot.className = 'nav-dot';
    dot.onclick = () => document.getElementById(`section-${idx + 1}`).scrollIntoView({ behavior: 'smooth' });
    navDots.appendChild(dot);
  });

  // Scroll reveal animation
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

  // Active TOC highlight
  const tocObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const idx = parseInt(entry.target.id.replace('section-', '')) - 1;
        document.querySelectorAll('.toc-item').forEach((el, i) => {
          el.classList.toggle('active', i === idx);
        });
        document.querySelectorAll('.nav-dot').forEach((el, i) => {
          el.classList.toggle('active', i === idx);
        });
      }
    });
  }, { threshold: 0.5 });

  document.querySelectorAll('section[id^="section-"]').forEach(el => tocObserver.observe(el));

  // Scroll progress bar
  window.addEventListener('scroll', () => {
    const scrollTop = document.documentElement.scrollTop;
    const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
    document.getElementById('progressBar').style.width = (scrollTop / scrollHeight * 100) + '%';
  });

  // Mobile menu toggle
  function toggleMobileMenu() {
    document.getElementById('sidebar').classList.toggle('mobile-visible');
  }
</script>
